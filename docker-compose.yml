services:
  api:
    build: .
    container_name: movie-app-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      MONGO_URI: mongodb://mongo:27017/movie_app
      REDIS_URL: redis://redis:6379

    depends_on:
      - mongo
      - redis

    restart: unless-stopped

  mongo:
    image: mongo:8

    container_name: movie-app-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: movie-app-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  mongo_data:
  redis_data: